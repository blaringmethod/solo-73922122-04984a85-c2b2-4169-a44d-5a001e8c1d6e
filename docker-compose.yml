name: traffic-pitr

services:
  db:
    image: postgres:16-bookworm
    container_name: traffic-pitr-db
    # The stock entrypoint runs as root and drops to postgres; use that root
    # phase to make sure the shared archive volume is writable by postgres
    # (a fresh named volume is otherwise root-owned and archival fails).
    entrypoint: ["/db-bin/entrypoint-fixperms.sh"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: traffic
      TZ: UTC
      WAL_ARCHIVE_DIR: /wal_archive
    command:
      - postgres
      - -c
      - "listen_addresses=*"
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      # New segments are archived as gzip (fully written + verified before
      # the final file is published); format is switchable at runtime via
      # PUT /archive/mode, which rewrites /wal_archive/.archive_mode.
      - -c
      - "archive_command=/db-bin/archive-dispatcher.sh %p %f"
      - -c
      - archive_timeout=10
      - -c
      - max_wal_senders=4
      - -c
      - wal_keep_size=256
    volumes:
      - pgdata:/var/lib/postgresql/data
      - wal_archive:/wal_archive
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/archive:/db-bin:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traffic"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"

  api:
    build: ./api
    container_name: traffic-pitr-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: traffic
      TZ: UTC
      WAL_ARCHIVE_DIR: /wal_archive
      # replica postgres refuses to run as root; the api container runs as root
      # and drops to this user (via gosu) only for the replica postmaster.
      REPLICA_RUN_AS: postgres
    volumes:
      - wal_archive:/wal_archive
      - backups:/backups
      - recovery_work:/recovery_work
      - api_state:/state
    ports:
      - "8000:8000"

volumes:
  pgdata:
  wal_archive:
  backups:
  recovery_work:
  api_state:
